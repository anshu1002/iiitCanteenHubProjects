openapi: 3.0.3
info:
  title: IIIT Canteen Hub API
  version: 1.0.0
  description: API for managing canteen food items.

servers:
  - url: http://localhost:3000/v1

paths:
  /foods:
    get:
      summary: Get all food items
      responses:
        '200':
          description: Food items retrieved successfully
        '304':
          description: Food items have not changed
        '429':
          description: Too many requests
    post:
      summary: Add a food item
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema:
            type: string
          description: Unique key to prevent duplicate requests
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - category
                - price
                - rating
              properties:
                name:
                  type: string
                category:
                  type: string
                price:
                  type: number
                rating:
                  type: number
                  minimum: 0
                  maximum: 5
      responses:
        '201':
          description: Food item created
        '400':
          description: Invalid request
        '409':
          description: Idempotency key conflict
        '429':
          description: Too many requests

  /foods/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
    get:
      summary: Get a food item by ID
      responses:
        '200':
          description: Food item found
        '404':
          description: Food item not found
    put:
      summary: Replace a food item
      responses:
        '200':
          description: Food item updated
        '404':
          description: Food item not found
    patch:
      summary: Partially update a food item
      responses:
        '200':
          description: Food item updated
        '404':
          description: Food item not found
    delete:
      summary: Delete a food item
      responses:
        '200':
          description: Food item deleted
        '404':
          description: Food item not found